name: Cypress E2E Tests

on: push

jobs:
  cypress-run:
    name: Cypress - ${{ matrix.spec }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false

      matrix:
        include:
          - spec: cypress/e2e/login.cy.js
            name: login

          - spec: cypress/e2e/catalogo.cy.js
            name: catalogo

          - spec: cypress/e2e/carrinho.cy.js
            name: carrinho

          - spec: cypress/e2e/checkout.cy.js
            name: checkout

          - spec: cypress/e2e/regressão/purchase-flow.cy.js
            name: purchase-flow

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          spec: ${{ matrix.spec }}

      - uses: actions/upload-artifact@v7
        with:
          name: cypress-reports-${{ matrix.name }}
          path: cypress/reports
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: cypress-videos-${{ matrix.name }}
          path: cypress/videos
          if-no-files-found: ignore